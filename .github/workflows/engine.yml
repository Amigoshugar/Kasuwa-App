name: Publish daily prices

# Recomputes the day's PROPOSED prices; an admin still publishes them in admin.html.
# 11:00 and 17:00 UTC = 12:00 and 18:00 in Lagos. GitHub may start these a few minutes late.
on:
  schedule:
    - cron: "0 11,17 * * *"
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Call the price engine
        env:
          API_URL: ${{ secrets.API_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$API_URL" ]; then echo "API_URL not set - skipping"; exit 0; fi
          # Free hosts may be asleep: wake the API first, then run the engine.
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$API_URL/health"
          curl -fsS -X POST -H "X-Admin-Token: $ADMIN_TOKEN" "$API_URL/engine/run"
