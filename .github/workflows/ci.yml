name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t kasuwa-api ./api

  deploy:
    # Runs only after tests pass on main, and only once the RENDER_DEPLOY_HOOK secret is set.
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK not set - skipping deploy"; exit 0; fi
          # Render's hook sometimes hangs or returns a 5xx (e.g. 520). Give each try 60 s, retry 3 times.
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/render.out -w "%{http_code}" --max-time 60 -X POST "$HOOK" || true)
            if [ "${code:-000}" -ge 200 ] 2>/dev/null && [ "$code" -lt 300 ]; then
              echo "Render deploy triggered (HTTP $code)"; exit 0
            fi
            echo "Attempt $i: Render returned HTTP ${code:-000}. Retrying in 20 s..."
            sleep 20
          done
          echo "::error::Render deploy hook failed 3 times. Open Render > kasuwa-api > Manual Deploy > Deploy latest commit."
          exit 1
